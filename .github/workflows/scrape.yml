name: Data Ingestion Pipeline

on:
  schedule:
    - cron: '0,30 * * * *' # Runs every 30 minutes
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python Engine
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Architecture Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests supabase playwright
        playwright install chromium

    - name: Execute Scraper Pipeline
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: python scraper.py