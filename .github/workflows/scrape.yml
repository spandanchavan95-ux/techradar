name: Automated Data Ingestion Pipeline

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows you to run it manually from a button on GitHub

jobs:
  scrape-and-ingest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python Engine
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Architecture Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 supabase

    - name: Execute Scraper Pipeline
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python scraper.py